name: Copilot review fallback

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check eligibility without requesting a review
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: copilot-review-fallback
  cancel-in-progress: false

jobs:
  review:
    if: vars.COPILOT_REVIEWS_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby bin/review_missing_prs.rb
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          REVIEW_OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
